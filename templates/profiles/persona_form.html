{% extends "base.html" %}
{% block title %}{% if obj %}페르소나 수정{% else %}페르소나 만들기{% endif %} — NOVA{% endblock %}

{% block content %}
<style>
  .form-wrap { max-width: 680px; margin: 0 auto; padding: 40px 24px 80px; }
  .form-title { font-size: 1.2rem; font-weight: 900; color: #c8d6ff; margin-bottom: 32px; }

  .form-label {
    display: block; font-size: .78rem; color: rgba(255,255,255,0.85);
    letter-spacing: .05em; margin-bottom: 8px; font-weight: 700;
  }
  .form-label span { color: #f87171; margin-left: 2px; }

  .form-input, .form-textarea {
    width: 100%; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; padding: 11px 14px;
    color: #d0dcff; font-size: .9rem; outline: none;
    box-sizing: border-box; font-family: inherit;
    transition: border-color .15s;
  }
  .form-input:focus, .form-textarea:focus { border-color: #4a7aff; }
  .form-textarea { resize: vertical; line-height: 1.65; }
  .form-hint { font-size: .75rem; color: rgba(255,255,255,0.55); margin-top: 6px; }
  .form-group { margin-bottom: 20px; }

  /* 섹션 구분선 */
  .section-divider {
    display: flex; align-items: center; gap: 12px;
    margin: 28px 0 20px;
  }
  .section-divider span {
    font-size: .72rem; font-weight: 800; letter-spacing: .1em;
    color: rgba(255,255,255,0.65); white-space: nowrap;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.07);
  }

  /* 2열 그리드 */
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media(max-width:520px){ .form-row { grid-template-columns: 1fr; } }

  /* 글자수 카운터 */
  .char-counter {
    text-align: right; font-size: .72rem;
    color: rgba(255,255,255,0.55); margin-top: 4px;
  }

  .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 32px; }
  .btn-cancel {
    padding: 10px 20px; border-radius: 8px;
    background: transparent; border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.5); font-size: .88rem; font-weight: 600;
    cursor: pointer; text-decoration: none;
  }
  .btn-cancel:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .btn-save {
    padding: 10px 28px; border-radius: 8px;
    background: linear-gradient(90deg,#1a3080,#2a50c0);
    border: none; color: #a8c0ff;
    font-size: .88rem; font-weight: 700; cursor: pointer;
  }
  .btn-save:hover { background: linear-gradient(90deg,#2040a0,#3a60e0); }
</style>

<div class="form-wrap">
  <div style="margin-bottom:24px;">
    <a href="{% url 'profiles:mypage' %}?tab=persona"
       style="color:rgba(255,255,255,0.35); font-size:.85rem; text-decoration:none;">
      ← 목록으로
    </a>
  </div>
  <div class="form-title">{% if obj %}페르소나 수정{% else %}페르소나 만들기{% endif %}</div>

  <form method="post">
    {% csrf_token %}

    <!-- 기본 정보 -->
    <div class="section-divider"><span>기본 정보</span></div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">이름 <span>*</span></label>
        <input type="text" name="title" class="form-input" maxlength="100"
               placeholder="예: 이준호"
               value="{{ obj.title|default:'' }}">
        <div class="form-hint">게임 선택 화면에 표시됩니다.</div>
      </div>
      <div class="form-group">
        <label class="form-label">나이 / 성별</label>
        <input type="text" name="age" class="form-input" maxlength="30"
               placeholder="예: 23세 남성"
               value="{{ obj.age|default:'' }}">
      </div>
    </div>

    <!-- 캐릭터 설정 -->
    <div class="section-divider"><span>캐릭터 설정</span></div>

    <div class="form-group">
      <label class="form-label">외모</label>
      <textarea name="appearance" class="form-textarea" rows="3" maxlength="500"
                id="ta-appearance"
                placeholder="예: 검은 단발머리, 날카로운 눈매, 키 175cm">{{ obj.appearance|default:'' }}</textarea>
      <div class="char-counter"><span id="cnt-appearance">0</span> / 500</div>
    </div>

    <div class="form-group">
      <label class="form-label">성격</label>
      <textarea name="personality" class="form-textarea" rows="3" maxlength="500"
                id="ta-personality"
                placeholder="예: 겉은 무뚝뚝하지만 속은 따뜻함. 정의감이 강하고 쉽게 포기하지 않는다.">{{ obj.personality|default:'' }}</textarea>
      <div class="char-counter"><span id="cnt-personality">0</span> / 500</div>
    </div>

    <div class="form-group">
      <label class="form-label">재능 / 특기</label>
      <textarea name="talent" class="form-textarea" rows="3" maxlength="500"
                id="ta-talent"
                placeholder="예: 검술에 뛰어남. 암기력이 좋고 언변이 탁월하다.">{{ obj.talent|default:'' }}</textarea>
      <div class="char-counter"><span id="cnt-talent">0</span> / 500</div>
    </div>

    <!-- 추가 메모 -->
    <div class="section-divider"><span>추가 메모 (선택)</span></div>

    <div class="form-group">
      <textarea name="content" class="form-textarea" rows="4" maxlength="1000"
                id="ta-content"
                placeholder="배경, 목표, 특이사항 등 AI에게 전달할 추가 정보를 자유롭게 입력하세요.">{{ obj.content|default:'' }}</textarea>
      <div class="char-counter"><span id="cnt-content">0</span> / 1000</div>
    </div>

    <div class="form-actions">
      <a href="{% url 'profiles:mypage' %}?tab=persona" class="btn-cancel">취소</a>
      <button type="submit" class="btn-save">저장</button>
    </div>
  </form>
</div>

<script>
[
  ['ta-appearance',  'cnt-appearance'],
  ['ta-personality', 'cnt-personality'],
  ['ta-talent',      'cnt-talent'],
  ['ta-content',     'cnt-content'],
].forEach(([taId, cntId]) => {
  const ta  = document.getElementById(taId);
  const cnt = document.getElementById(cntId);
  function update() { cnt.textContent = ta.value.length; }
  ta.addEventListener('input', update);
  update();
});
</script>
{% endblock %}
