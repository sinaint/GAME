<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Story Game{% endblock %}</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* 페이지 기본 폭/여백 */
    .page-wrap { max-width: 720px; margin: 40px auto; padding: 0 16px; }
  </style>
</head>

<!-- body는 반드시 1개만 있어야 함 -->
<body class="bg-dark text-light">

  {% block topbar %}
  <div style="flex-shrink:0; padding: 14px 24px; display:flex; align-items:center; justify-content:space-between;
              border-bottom:1px solid rgba(255,255,255,0.06);">
    <a href="/" style="font-weight:900; font-size:22px; letter-spacing:-.5px; color:#fff; text-decoration:none;">NOVA</a>
    <div style="display:flex; align-items:center; gap:16px;">
      {% if user.is_authenticated %}
        <a href="{% url 'profiles:mypage' %}"
           style="font-size:.85rem; color:rgba(255,255,255,0.5); text-decoration:none; font-weight:600;"
           onmouseover="this.style.color='#fff'" onmouseout="this.style.color='rgba(255,255,255,0.5)'">마이페이지</a>
        <a href="{% url 'logout' %}"
           style="font-size:.85rem; color:rgba(255,255,255,0.35); text-decoration:none;"
           onmouseover="this.style.color='#fff'" onmouseout="this.style.color='rgba(255,255,255,0.35)'">로그아웃</a>
      {% else %}
        <a href="{% url 'login' %}"
           style="font-size:.85rem; color:rgba(255,255,255,0.5); text-decoration:none; font-weight:600;"
           onmouseover="this.style.color='#fff'" onmouseout="this.style.color='rgba(255,255,255,0.5)'">로그인</a>
      {% endif %}
    </div>
  </div>
  {% endblock %}

  <div class="{% block wrap_class %}page-wrap{% endblock %}">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
